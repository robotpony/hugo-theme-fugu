# The smallest site Fugu supports: recipes and tags, nothing else.
# See ../README.md.
baseURL = "https://example.org/"
title = "Recipes only"
theme = ["fugu", "blowfish"]
themesDir = "../../../.."

# hugo-warped, which Fugu imports, is checked out beside the themes, not
# fetched: map its module path to that folder (relative to themesDir).
[module]
  replacements = "github.com/robotpony/hugo-warped -> hugo-warped"

[taxonomies]
  tag = "tags"

[params]
  mainSections = ["recipes"]
