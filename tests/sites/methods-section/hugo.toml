# The everything site with methods in their own section, content/methods/
# (params.fugu.methodSection), instead of the essay section. See ../README.md.
baseURL = "https://example.org/"
title = "Methods section"
theme = ["fugu", "blowfish"]
themesDir = "../../../.."
buildDrafts = true  # drafts publish as pages in development

# hugo-warped, which Fugu imports, is checked out beside the themes, not
# fetched: map its module path to that folder (relative to themesDir).
[module]
  replacements = "github.com/robotpony/hugo-warped -> hugo-warped"

[taxonomies]
  tag = "tags"
  cuisine = "cuisine"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "cuisine"
    weight = 80

[params]
  mainSections = ["recipes"]
  enableSearch = true

  [params.article]
    showTableOfContents = true
    showRelatedContent = true
    relatedContentLimit = 3  # Blowfish errors without it when related content is on
    showTaxonomies = true
    showBreadcrumbs = true

  [params.fugu]
    methodSection = "methods"
    # Reference essays in the reference section, by content path.
    referenceEssays = "reference/essays"

  [params.recipe]
    enableKelvin = false
