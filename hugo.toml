# Fugu's defaults. Hugo merges these under a site's own config, so a site
# sets only what differs, in its [params.fugu]. The content tools in
# tools/ read the merged values too (through `hugo config`).

[params.fugu]
  # Section folders under content/. Set one to "" to say the site doesn't
  # have it. Only the recipe section is required. A renamed section's
  # _index.md also sets `type` to the default name (e.g. `type: recipes` in
  # content/dishes/_index.md), so Hugo finds Fugu's list layout for it.
  recipeSection = "recipes"
  essaySection = "essays"
  referenceSection = "reference"
  logSection = "the-food-log"

  # Where wiki links look for glossary terms (see render-link.html): a
  # folder in the essay section whose pages are reference essays, and a
  # page in the reference section whose ## headings are short entries.
  # "" turns either off.
  referenceEssays = "reference-essays"
  glossaryPage = "glossary"


  # Personal notes: blockquotes in a recipe's intro (before its first ##)
  # are hidden from readers, like the headings.hidden sections below. Only
  # hidden: the text is still in the HTML, the search index, and the RSS
  # feed, so it isn't private. false shows them.
  hideIntroQuotes = true

  # The recipe sidebar's section boxes, top to bottom, under search and the
  # facts list. Each key takes the matching ## section out of the article
  # (photos: the page's images): to-serve, mechanic, variations, equipment,
  # notes, photos. Leave a key out to keep that section in the article.
  recipeSidebar = ["photos", "to-serve", "mechanic", "variations", "equipment", "notes"]

  # What each ## heading means, by its whole title (any case, trailing ":"
  # ignored). method: prose whose quantities and temperatures get marked.
  # mechanic, to-serve, variations, notes, equipment: sections that can
  # move into the sidebar (see recipeSidebar). hidden: recipe sections
  # hidden from readers (still in the HTML; not private). Every other ##
  # on a recipe is an ingredient section unless it has one of the
  # notIngredients words ("Basic method", "Timing examples").
  # Drafts (`draft: true`) as pages that are published but still
  # changing, when the site builds drafts (buildDrafts). A draft gets a
  # banner under its title and tags (partials/development/banner.html) and a mark
  # on its card with the hover text (partials/recipe-card.html). A page can
  # add its own `working_on` line, shown under the banner's sentence.
  [params.fugu.development]
    label   = "In development"
    # The card chip's label, when `label` is too long for a card's top
    # row; "" uses `label`. The popover and banner always use `label`.
    short   = ""
    message = "This recipe is still changing. Cook it, change it, and expect it to move before it becomes canon."
    hover   = "Published while it's still being worked out. It works, but the next version will be a little different."
    note    = "Working on"
    # A page that explains drafts: the banner and card mark link to it,
    # and it lists every draft, under `heading`, in place of related
    # content. A path as site.GetPage takes it; "" means no link and no
    # list.
    page    = ""
    more    = "How this works"
    heading = "In development now"
    # What that page's list says when there are no drafts (or the site
    # doesn't build them).
    empty   = "Nothing is in development right now."
    # An SVG in the site's assets/ to use as the mark (e.g.
    # "icons/development.svg"), inlined so it can use currentColor. ""
    # draws a dot.
    icon    = ""

  [params.fugu.headings]
    method = ["Method", "Directions", "Steps"]
    mechanic = ["Mechanic"]
    to-serve = ["To serve"]
    variations = ["Variations"]
    notes = ["Notes"]
    equipment = ["Equipment", "Special equipment", "Hardware"]
    hidden = ["History"]
    notIngredients = ["method", "directions", "steps", "notes", "serve", "variations", "timing", "example", "examples", "rules", "equipment", "hardware", "substitutions", "mechanic", "history"]
