# Builds the fixture sites (tests/sites/) against pinned Hugo and Blowfish
# versions, failing on any warning, and checks their pages (tests/check.py). check.py also builds
# exampleSite/ and checks every site's links; the install job installs Fugu on a new
# site both ways. PLAN.md §9 adds the tool tests.
#
# Hugo is pinned inside Blowfish's declared range for that commit
# (295dae3 allows 0.163.0–0.166.0); outside it, Hugo warns about the
# module and --panicOnWarning fails the build. Move both together.
name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  HUGO_VERSION: 0.166.0
  BLOWFISH_REF: 295dae334547f6737a939a5d49f2807d6c0b73b8

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      # The fixtures find their themes at ../../../.. (themesDir), so Fugu
      # and Blowfish go side by side under themes/, as in a real site.
      - uses: actions/checkout@v5
        with:
          path: themes/fugu
      - uses: actions/checkout@v5
        with:
          repository: nunocoracao/blowfish
          ref: ${{ env.BLOWFISH_REF }}
          path: themes/blowfish
      - name: Install Hugo
        run: |
          curl -sSLf -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version
      # Builds every site in tests/sites/ and exampleSite/, checks their
      # links and each expect.txt. Sites with an XFAIL file are reported but
      # don't fail the job.
      - name: Build and check the fixtures and example site
        run: python3 themes/fugu/tests/check.py

  # Installs Fugu on a new site by each method, as docs/getting-started.md
  # says, fetching Blowfish for real (tests/install.py). Catches the
  # install steps and docs drifting from the theme, which the fixtures
  # can't, since they find the themes through themesDir.
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        method: [modules, submodules]
    steps:
      # Full history: the submodule install clones this checkout.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        if: matrix.method == 'modules'
        with:
          go-version: stable
          cache: false
      - name: Install Hugo
        run: |
          curl -sSLf -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version
      - name: Install Fugu by ${{ matrix.method }} and build a recipe
        run: python3 tests/install.py ${{ matrix.method }}
