# Builds the fixture sites (tests/sites/) against pinned Hugo and Blowfish
# versions, failing on any warning, and checks their pages (tests/check.py). PLAN.md §9 extends this with the
# example site, the tool tests, and a link check.
#
# Hugo is pinned inside Blowfish's declared range for that commit
# (e9699d8 allows 0.158.0–0.161.1); outside it, Hugo warns about the
# module and --panicOnWarning fails the build. Move both together.
name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  HUGO_VERSION: 0.161.1
  BLOWFISH_REF: e9699d8c5da9a64a105eb8401fd2cf79c6015c6f

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      # The fixtures find their themes at ../../../.. (themesDir), so Fugu
      # and Blowfish go side by side under themes/, as in a real site.
      - uses: actions/checkout@v5
        with:
          path: themes/fugu
      - uses: actions/checkout@v5
        with:
          repository: nunocoracao/blowfish
          ref: ${{ env.BLOWFISH_REF }}
          path: themes/blowfish
      - name: Install Hugo
        run: |
          curl -sSLf -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version
      # Builds every site in tests/sites/ and checks its expect.txt. Sites
      # with an XFAIL file are reported but don't fail the job.
      - name: Build and check the fixtures
        run: python3 themes/fugu/tests/check.py
